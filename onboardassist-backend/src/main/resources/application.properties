spring.application.name=onboardassist-backend

# Render will provide the port
server.port=${PORT:8080}

# ===============================
# Database (Render Environment Variables)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===============================
# Gemini
# ===============================
gemini.api.key=${GEMINI_API_KEY}
gemini.embedding.model=gemini-embedding-001
gemini.chat.model=gemini-3.8-flash
gemini.api.base-url=https://generativelanguage.googleapis.com

# ===============================
# Gemini Resilience
# ===============================
gemini.api.connect-timeout-ms=5000
gemini.api.read-timeout-ms=30000
gemini.api.retry.max-attempts=3
gemini.api.retry.initial-delay-ms=1000

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${CORS_ORIGINS:https://onboardassist-gamma.vercel.app}